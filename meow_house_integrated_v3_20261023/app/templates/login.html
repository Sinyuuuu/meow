<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登入 · Meow一下</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23f7c97e'/%3E%3Ctext x='32' y='44' font-size='38' text-anchor='middle'%3E🐾%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}?v=3">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-story">
      <div class="login-brand"><span class="brand-mark">⌂</span><strong>Meow一下</strong></div>
      <div class="story-copy">
        <span class="eyebrow">SMART CAT HOUSE · A01</span>
        <h1>寄養的每一刻，<br>都讓主人安心看見。</h1>
        <p>照護人員陪伴 Momo，AI 自動記錄牠在智慧貓屋裡的活動；你可以在遠方，安心掌握今天的每個足跡。</p>
      </div>
      <div class="cat-window" aria-hidden="true">
        <span class="window-moon">☾</span><span class="cat-silhouette">🐈</span>
        <span class="window-caption">Momo 正在 A01 好好休息</span>
      </div>
    </section>
    <section class="login-panel">
      <div class="login-form-wrap">
        <span class="paw-badge" aria-hidden="true">🐾</span>
        <h2>歡迎回來</h2>
        <p>登入查看 Momo 的寄養照護近況</p>
        {% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}
        <form method="post" action="/login" class="login-form">
          <label>電子信箱<input type="email" name="email" value="owner@meow.local" autocomplete="email" required></label>
          <label>密碼<input type="password" name="password" value="Meow123!" autocomplete="current-password" required></label>
          <button class="primary-button" type="submit">登入照護平台 <span>→</span></button>
        </form>
        <div class="demo-account"><strong>Prototype 示範帳號（密碼皆為 Meow123!）</strong><span>飼主</span><span>owner@meow.local</span><span>照護員</span><span>caregiver@meow.local</span><span>管理員</span><span>admin@meow.local</span></div>
      </div>
    </section>
  </main>
</body>
</html>
